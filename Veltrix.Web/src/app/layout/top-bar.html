<header class="glass sticky top-0 z-30 border-b border-border">
  <div class="mx-auto flex h-16 max-w-[1440px] items-center gap-2 px-4 md:gap-3 md:px-6">
    <!-- Phones have no sidebar: show the logo here -->
    <a routerLink="/" class="flex items-center md:hidden" [attr.aria-label]="'VELTRIX home' | t">
      <span class="grid size-8 place-items-center rounded-control bg-primary text-sm font-bold text-on-primary">V</span>
    </a>
    <!-- Visual only: each page has its own <h1> (vx-page-header), so screen readers do not hear the title twice -->
    <span class="hidden truncate text-[15px] font-semibold md:block" aria-hidden="true">{{ pageTitle() | t }}</span>

    <div class="ml-auto flex items-center gap-1.5 md:gap-2">
      @if (auth.isLoggedIn()) {
        <!-- Balance -->
        <a
          routerLink="/wallet"
          class="flex h-9 items-center gap-2 rounded-full border border-border bg-surface-2 pr-3.5 pl-2.5 text-text transition-colors duration-200 hover:border-muted/40"
          [title]="'Virtual balance (no monetary value)' | t"
        >
          <lucide-icon [img]="icons.vlx" [size]="16" class="text-accent" aria-hidden="true" />
          <vx-animated-number class="text-sm font-semibold" [value]="wallet.balance()" />
          <span class="hidden text-xs font-medium text-muted sm:inline">VLX</span>
        </a>

        <!-- Daily bonus -->
        @if (canClaimBonus()) {
          <!-- Text button only from 1024px (the page title needs the room, especially in Georgian); an icon below.
               max-lg:hidden, not "hidden lg:inline-flex": vxButton sets its own display (inline-flex), which would beat a plain "hidden" -->
          <button vxButton type="button" variant="primary" size="sm" class="max-lg:hidden" [loading]="wallet.claiming()" (click)="claimBonus()">
            <lucide-icon [img]="icons.gift" [size]="15" aria-hidden="true" />
            {{ 'Claim bonus' | t }}
          </button>
          <button vxButton type="button" variant="primary" size="icon" class="lg:hidden" [attr.aria-label]="'Claim daily bonus' | t" (click)="claimBonus()">
            <lucide-icon [img]="icons.gift" [size]="18" aria-hidden="true" />
          </button>
        } @else if (bonusCountdown(); as countdown) {
          <span
            class="hidden h-9 items-center gap-2 rounded-full border border-border px-3 text-xs text-muted lg:inline-flex"
            [title]="'Next daily bonus' | t"
          >
            <lucide-icon [img]="icons.gift" [size]="15" aria-hidden="true" />
            <span class="num">{{ countdown }}</span>
          </span>
        }

        <!-- AI assistant (players only): the drawer and its code load on first use -->
        @if (auth.isPlayer()) {
          <button
            vxButton
            type="button"
            variant="ghost"
            size="icon"
            aria-haspopup="dialog"
            [attr.aria-label]="'AI assistant' | t"
            [attr.aria-expanded]="assistantOpen()"
            (click)="openAssistant()"
          >
            <lucide-icon [img]="icons.sparkles" [size]="18" aria-hidden="true" />
          </button>
        }

        <!-- Notifications: unread badge; new ones arrive live over SignalR. The dropdown loads on first use. -->
        <button
          vxButton
          type="button"
          variant="ghost"
          size="icon"
          class="relative"
          aria-haspopup="dialog"
          [attr.aria-label]="
            notifications.unreadCount() > 0 ? ('Notifications, {count} unread' | t: { count: notifications.unreadCount() }) : ('Notifications' | t)
          "
          [attr.aria-expanded]="openPopup() === 'notifications'"
          (click)="toggle('notifications', $event)"
        >
          <lucide-icon [img]="icons.bell" [size]="18" aria-hidden="true" />
          @if (notifications.unreadCount() > 0) {
            <span
              class="num absolute top-1 right-1 grid h-4 min-w-4 animate-pop-in place-items-center rounded-full bg-primary px-1 text-[10px] leading-none font-semibold text-on-primary"
              aria-hidden="true"
            >
              {{ notifications.badge() }}
            </span>
          }
        </button>

        <!-- Account menu (top-bar-popups.ts) -->
        @if (auth.user(); as user) {
          <button
            type="button"
            class="flex items-center gap-1.5 rounded-full p-0.5 pr-1.5 transition-colors duration-200 hover:bg-surface-2"
            [attr.aria-label]="'Account menu' | t"
            aria-haspopup="menu"
            [attr.aria-expanded]="openPopup() === 'account'"
            (click)="toggle('account', $event)"
          >
            <vx-avatar [src]="user.avatarUrl" [name]="user.nickname" size="sm" />
            <lucide-icon [img]="icons.chevronDown" [size]="14" class="hidden text-muted md:inline-flex" aria-hidden="true" />
          </button>
        }
      } @else {
        <!-- Guests have no Settings page: the language switch is here (logged in: Settings and the account menu) -->
        <button
          vxButton
          type="button"
          variant="ghost"
          size="sm"
          class="px-2!"
          [attr.aria-label]="i18n.language() === 'ka' ? ('Switch to English' | t) : ('Switch to Georgian' | t)"
          [title]="i18n.language() === 'ka' ? ('Switch to English' | t) : ('Switch to Georgian' | t)"
          (click)="preferences.toggleLanguage()"
        >
          <lucide-icon [img]="icons.languages" [size]="16" aria-hidden="true" />
          <span class="text-xs font-semibold" aria-hidden="true">{{ i18n.language() === 'ka' ? 'EN' : 'KA' }}</span>
        </button>
        <vx-theme-toggle />
        <a vxButton routerLink="/login" variant="ghost" size="sm">{{ 'Log in' | t }}</a>
        <a vxButton routerLink="/register" variant="primary" size="sm">{{ 'Register' | t }}</a>
      }
    </div>
  </div>
</header>
