<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>VELTRIX</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VELTRIX: real-time multiplayer Crash game with virtual VLX points (educational project).">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before Angular starts, so the page never flashes the wrong colors
    (function () {
      try {
        var saved = localStorage.getItem('vx.theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* storage blocked: keep the default */ }
    })();
  </script>
</head>
<body>
  <vx-root></vx-root>
</body>
</html>
